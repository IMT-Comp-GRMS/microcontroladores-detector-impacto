# mosquitto.conf — ImpactOS Monitor v2.0
# Salvar em: /etc/mosquitto/conf.d/impactos.conf
#
# Após salvar, reiniciar o broker:
#   sudo systemctl restart mosquitto

# ── Listener MQTT padrão (para o Python publisher)
listener 1883
allow_anonymous true

# ── Listener WebSocket (para o dashboard no browser)
listener 9001
protocol websockets
allow_anonymous true
